events {}

http {
    upstream backend_a {
        server backend-a:3001;
    }

    upstream backend_b {
        server backend-b:3002;
    }

    server {
        listen 3001;

        location / {
            proxy_pass http://backend_a;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 3002;

        location / {
            proxy_pass http://backend_b;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
