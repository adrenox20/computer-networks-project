worker_processes auto;

events {
    worker_connections 1024;
}

http {

    upstream backend_pool {

        server host.docker.internal:13001
            max_fails=2
            fail_timeout=5s;

        server host.docker.internal:13002
            max_fails=2
            fail_timeout=5s;
    }

    server {
        listen 80;
        server_name app.team1.test;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.team1.test;

        ssl_certificate     /etc/nginx/tls/app.team1.test.crt;
        ssl_certificate_key /etc/nginx/tls/app.team1.test.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;

            add_header Cache-Control "no-store" always;
        }

        location /health {
            proxy_pass http://backend_pool/health;
        }
    }
}
